/* ─── LocalStorage helpers ───────────────────────────────────────── */
const STORAGE_KEY = "novelforge_autosave";

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.chapters && data.chapters.length > 0) return data;
    }
  } catch(e) {}
  return null;
}

function saveToStorage(chapters, bookTitle) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      chapters,
      bookTitle: bookTitle || "ลมกรด",
      savedAt: new Date().toISOString(),
    }));
  } catch(e) {}
}

/* ─── Word count helper ──────────────────────────────────────────── */
function countWords(text) {
  if (!text || !text.trim()) return 0;
  return text.trim().split(/\s+/).length;
}

function getStatus(words) {
  if (words === 0) return "outline";
  if (words < 500) return "draft";
  if (words < 900) return "writing";
  return "done";
}

const SLASH_CMDS = [
  ["/character", "เพิ่มตัวละคร"],
  ["/location", "เพิ่มสถานที่"],
  ["/rewrite", "ช่วยเขียนใหม่"],
  ["/expand", "ขยายเนื้อหา"],

/* ─── Micro components ───────────────────────────────────────────── */
function Icon({ d, size = 14, strokeWidth = 1.8 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p} />) : <path d={d} />}
    </svg>
  );
}

function Tag({ label, onRemove }) {
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      padding: "2px 8px", borderRadius: 12,

    }}>
      {label}
      {onRemove && <span style={{ cursor: "pointer", opacity: 0.6, fontSize: 10 }} onClick={onRemove}>✕</span>}
    </span>
  );
}

function Toggle({ checked, onChange }) {
  return (
    <div onClick={() => onChange(!checked)} style={{
      width: 32, height: 17, borderRadius: 9,
      background: checked ? T.accent : T.bg4,

        width: 11, height: 11, borderRadius: "50%",
        background: "#fff", transition: "left .2s",

}

/* ─── Page Border Renderer ───────────────────────────────────────── */
const PAGE_BORDERS = [
  { id: "none",       label: "ไม่มีขอบ",       preview: "—" },
  { id: "simple",     label: "เส้นเดี่ยว",      preview: "□" },
  { id: "double",     label: "เส้นคู่",          preview: "⊞" },
  { id: "thick",      label: "เส้นหนา",          preview: "▪" },
  { id: "dashed",     label: "เส้นประ",          preview: "⋯" },
  { id: "corner",     label: "มุมประดับ",        preview: "✦" },
  { id: "ornate",     label: "วินเทจ",           preview: "❧" },
  { id: "floral",     label: "ดอกไม้",           preview: "❀" },
  { id: "dots",       label: "จุด",              preview: "·" },
  { id: "wave",       label: "คลื่น",            preview: "〜" },
  { id: "classical",  label: "คลาสสิก",          preview: "◈" },
  { id: "brush",      label: "พู่กัน",           preview: "∿" },
];

function PageBorderOverlay({ borderStyle, color }) {
  const c = color || "#8b4513";
  const s = { position: "absolute", pointerEvents: "none" };

  if (borderStyle === "none") return null;

  if (borderStyle === "simple") return (
    <div style={{ ...s, inset: 10, border: `1.5px solid ${c}55` }} />
  );

  if (borderStyle === "double") return (<>
    <div style={{ ...s, inset: 8,  border: `1px solid ${c}66` }} />
    <div style={{ ...s, inset: 13, border: `1px solid ${c}44` }} />
  </>);

  if (borderStyle === "thick") return (
    <div style={{ ...s, inset: 8, border: `4px solid ${c}44`, borderRadius: 1 }} />
  );

  if (borderStyle === "dashed") return (
    <div style={{ ...s, inset: 10, border: `1.5px dashed ${c}55`, borderRadius: 1 }} />
  );

  if (borderStyle === "dots") return (
    <div style={{ ...s, inset: 10, border: `2px dotted ${c}55`, borderRadius: 1 }} />
  );

  if (borderStyle === "corner") {
    const corner = (top, left, right, bottom, rotate) => (
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"
        style={{ position: "absolute", top, left, right, bottom, transform: `rotate(${rotate}deg)`, opacity: 0.55 }}>
        <path d="M2 2 L2 12 M2 2 L12 2" stroke={c} strokeWidth="1.5" strokeLinecap="round"/>
        <circle cx="2" cy="2" r="2" fill={c} />
        <path d="M8 8 L8 16 M8 8 L16 8" stroke={c} strokeWidth="1" strokeLinecap="round" opacity="0.5"/>
      </svg>
    );
    return (<>
      {corner(8, 8, null, null, 0)}
      {corner(8, null, 8, null, 90)}
      {corner(null, null, 8, 8, 180)}
      {corner(null, 8, null, 8, 270)}
      <div style={{ ...s, inset: 18, border: `0.5px solid ${c}22` }} />
    </>);
  }

  if (borderStyle === "ornate") {
    const W = 520, H = 735;
    return (
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none"
        style={{ ...s, inset: 0, width: "100%", height: "100%" }}>
        <rect x="10" y="10" width={W-20} height={H-20} stroke={c} strokeWidth="1" opacity="0.5"/>
        <rect x="16" y="16" width={W-32} height={H-32} stroke={c} strokeWidth="0.5" opacity="0.3" strokeDasharray="4 3"/>
        {/* Corner ornaments */}
        {[[14,14,0],[W-14,14,90],[W-14,H-14,180],[14,H-14,270]].map(([x,y,r],i)=>(
          <g key={i} transform={`translate(${x},${y}) rotate(${r})`}>
            <path d="M0,0 L12,0 M0,0 L0,12" stroke={c} strokeWidth="1.5" strokeLinecap="round" opacity="0.8"/>
            <path d="M3,3 L8,3 M3,3 L3,8" stroke={c} strokeWidth="0.8" strokeLinecap="round" opacity="0.5"/>
            <circle cx="0" cy="0" r="1.5" fill={c} opacity="0.8"/>
          </g>
        ))}
        {/* Mid edge ornaments */}
        {[[W/2,12],[W/2,H-12],[12,H/2],[W-12,H/2]].map(([x,y],i)=>(
          <g key={i} transform={`translate(${x},${y})`}>
            <path d="M-4,0 L4,0 M0,-4 L0,4" stroke={c} strokeWidth="0.8" opacity="0.4"/>
            <circle cx="0" cy="0" r="1.2" fill={c} opacity="0.5"/>
          </g>
        ))}
      </svg>
    );
  }

  if (borderStyle === "floral") {
    const W = 520, H = 735;
    const Flower = ({x,y,r=0,s=1}) => (
      <g transform={`translate(${x},${y}) rotate(${r}) scale(${s})`}>
        {[0,60,120,180,240,300].map((a,i)=>(
          <ellipse key={i} cx={Math.cos(a*Math.PI/180)*5} cy={Math.sin(a*Math.PI/180)*5}
            rx="3.5" ry="2" fill={c} opacity="0.3" transform={`rotate(${a})`}/>
        ))}
        <circle cx="0" cy="0" r="2" fill={c} opacity="0.5"/>
      </g>
    );
    const vine = (x1,y1,x2,y2) => (
      <path d={`M${x1},${y1} Q${(x1+x2)/2+10},${(y1+y2)/2-10} ${x2},${y2}`}
        stroke={c} strokeWidth="0.8" fill="none" opacity="0.3"/>
    );
    return (
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none"
        style={{ ...s, inset: 0, width: "100%", height: "100%" }}>
        <rect x="14" y="14" width={W-28} height={H-28} stroke={c} strokeWidth="0.8" opacity="0.3"/>
        {/* Flowers at corners */}
        <Flower x={22} y={22} r={0}/>
        <Flower x={W-22} y={22} r={45}/>
        <Flower x={W-22} y={H-22} r={90}/>
        <Flower x={22} y={H-22} r={135}/>
        {/* Flowers along edges */}
        {[W/4,W/2,3*W/4].map((x,i)=><Flower key={i} x={x} y={18} r={i*20} s={0.8}/>)}
        {[W/4,W/2,3*W/4].map((x,i)=><Flower key={i} x={x} y={H-18} r={i*20} s={0.8}/>)}
        {[H/4,H/2,3*H/4].map((y,i)=><Flower key={i} x={18} y={y} r={i*20} s={0.8}/>)}
        {[H/4,H/2,3*H/4].map((y,i)=><Flower key={i} x={W-18} y={y} r={i*20} s={0.8}/>)}
        {/* Vines */}
        {vine(30,30,80,18)}{vine(80,18,W-80,18)}{vine(W-80,18,W-30,30)}
        {vine(30,H-30,80,H-18)}{vine(80,H-18,W-80,H-18)}{vine(W-80,H-18,W-30,H-30)}
      </svg>
    );
  }

  if (borderStyle === "wave") {
    const W = 520, H = 735;
    const waveTop = `M14,18 ${Array.from({length:25},(_,i)=>`Q${14+i*20+10},${i%2===0?10:26} ${14+(i+1)*20},18`).join(" ")}`;
    const waveBot = `M14,${H-18} ${Array.from({length:25},(_,i)=>`Q${14+i*20+10},${i%2===0?H-10:H-26} ${14+(i+1)*20},${H-18}`).join(" ")}`;
    return (
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none"
        style={{ ...s, inset: 0, width: "100%", height: "100%" }}>
        <path d={waveTop} stroke={c} strokeWidth="1.2" opacity="0.4"/>
        <path d={waveBot} stroke={c} strokeWidth="1.2" opacity="0.4"/>
        <line x1="14" y1="14" x2="14" y2={H-14} stroke={c} strokeWidth="1" opacity="0.3"/>
        <line x1={W-14} y1="14" x2={W-14} y2={H-14} stroke={c} strokeWidth="1" opacity="0.3"/>
      </svg>
    );
  }

  if (borderStyle === "classical") {
    const W = 520, H = 735;
    return (
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none"
        style={{ ...s, inset: 0, width: "100%", height: "100%" }}>
        <rect x="8" y="8" width={W-16} height={H-16} stroke={c} strokeWidth="2" opacity="0.45"/>
        <rect x="14" y="14" width={W-28} height={H-28} stroke={c} strokeWidth="0.5" opacity="0.25"/>
        {/* Diamond corners */}
        {[[8,8],[W-8,8],[W-8,H-8],[8,H-8]].map(([x,y],i)=>(
          <rect key={i} x={x-5} y={y-5} width="10" height="10"
            fill={c} opacity="0.6" transform={`rotate(45 ${x} ${y})`}/>
        ))}
        {/* Mid-edge diamonds */}
        {[[W/2,8],[W/2,H-8],[8,H/2],[W-8,H/2]].map(([x,y],i)=>(
          <rect key={i} x={x-3.5} y={y-3.5} width="7" height="7"
            fill={c} opacity="0.4" transform={`rotate(45 ${x} ${y})`}/>
        ))}
      </svg>
    );
  }

  if (borderStyle === "brush") {
    const W = 520, H = 735;
    return (
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} fill="none"
        style={{ ...s, inset: 0, width: "100%", height: "100%" }}>
        {/* Rough brush strokes as thick varied paths */}
        <path d={`M12,20 Q${W/4},8 ${W/2},16 Q${3*W/4},6 ${W-12},20`}
          stroke={c} strokeWidth="4" strokeLinecap="round" opacity="0.25" fill="none"/>
        <path d={`M12,${H-20} Q${W/4},${H-8} ${W/2},${H-16} Q${3*W/4},${H-6} ${W-12},${H-20}`}
          stroke={c} strokeWidth="4" strokeLinecap="round" opacity="0.25" fill="none"/>
        <path d={`M16,16 Q8,${H/4} 14,${H/2} Q6,${3*H/4} 16,${H-16}`}
          stroke={c} strokeWidth="4" strokeLinecap="round" opacity="0.25" fill="none"/>
        <path d={`M${W-16},16 Q${W-8},${H/4} ${W-14},${H/2} Q${W-6},${3*H/4} ${W-16},${H-16}`}
          stroke={c} strokeWidth="4" strokeLinecap="round" opacity="0.25" fill="none"/>
        {/* Inner thin line */}
        <rect x="18" y="18" width={W-36} height={H-36} stroke={c} strokeWidth="0.5" opacity="0.2"/>
      </svg>
    );
  }

  return null;
}
function Toolbar({ activeMode, borderStyle, setBorderStyle, borderColor, setBorderColor }) {
  const [bold, setBold] = useState(false);
  const [italic, setItalic] = useState(false);
  const [under, setUnder] = useState(false);
  const [showBorderPicker, setShowBorderPicker] = useState(false);

  if (activeMode !== "writing") return null;

  const Tb = ({ children, active, onClick, title, style = {} }) => (
    <button title={title} onClick={onClick} style={{
      background: active ? "rgba(139,69,19,0.3)" : "transparent",

              <div style={{

/* ─── Writing Canvas ─────────────────────────────────────────────── */
function WritingCanvas({ activeChapter, chapters, onUpdateContent, borderStyle, borderColor }) {

  const chIdx = chapters.indexOf(ch);
  const [editing, setEditing] = useState(false);
  const textRef = useRef(null);

  useEffect(() => {
    setEditing(false);
  }, [activeChapter]);

  const content = ch ? (ch.content || "") : "";
  const paragraphs = content.split("\n\n").filter(p => p.trim());

  return (
    <div style={{

        }}>

          <span>{ch ? ch.title : ""}</span>
        </div>

        {/* Chapter heading */}
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "#8b6a45", marginBottom: 10, fontWeight: 600 }}>

            fontFamily: "'Playfair Display', serif", fontSize: 22, fontWeight: 700,

              background: "#fffef8",

          <div
            onClick={() => setEditing(true)}
            title="คลิกเพื่อแก้ไข"
            style={{
              fontSize: 15, lineHeight: 1.9, color: "#1a1612",
              textAlign: "justify", fontFamily: "'Sarabun', sans-serif",
              cursor: "text", minHeight: 100,
              borderRadius: 4, transition: "background .15s",
            }}
            onMouseEnter={e => e.currentTarget.style.background = "#f5f0e818"}
            onMouseLeave={e => e.currentTarget.style.background = "transparent"}
          >
            {paragraphs.length > 0 ? paragraphs.map((para, i) => (
              <p key={i} style={{ marginBottom: "0.4em", textIndent: i === 0 ? 0 : "2em" }}>{para}</p>

              <p style={{ color: "#bbb", fontStyle: "italic" }}>คลิกเพื่อเริ่มเขียน...</p>
            )}

        {/* Page number */}
        <div style={{
          position: "absolute", bottom: 24, left: 0, right: 0,
          textAlign: "center", fontSize: 10, color: "#bbb", letterSpacing: "0.1em",

    </div>
  );

/* ─── Status Bar ─────────────────────────────────────────────────── */
function StatusBar({ mode, setMode, chapters, activeChapter }) {
  const ch = chapters.find(c => c.id === activeChapter) || chapters[0];
  const words = ch ? countWords(ch.content || "") : 0;
  const chars = ch ? (ch.content || "").length : 0;
  const totalWords = chapters.reduce((s, c) => s + countWords(c.content || ""), 0);
  const estPages = Math.ceil(totalWords / 350) || 1;
  const modes = [
    { id: "writing", icon: "✍️", label: "Writing Mode" },
    { id: "book", icon: "📖", label: "Book Preview" },
    { id: "kindle", icon: "📱", label: "Kindle Preview" },
    { id: "print", icon: "🖨", label: "Print Preview" },
  ];
  return (
    <div style={{
      height: 30, background: T.bg1, borderTop: `1px solid ${T.border}`,
      display: "flex", alignItems: "center", padding: "0 12px", gap: 12,
      flexShrink: 0, justifyContent: "space-between",
    }}>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: T.inkDim }}>
        <span>Words: <strong style={{ color: T.inkMid }}>{words.toLocaleString()}</strong></span>
        <span>Chars: <strong style={{ color: T.inkMid }}>{chars.toLocaleString()}</strong></span>
        <span>Total: <strong style={{ color: T.inkMid }}>{totalWords.toLocaleString()} คำ</strong></span>
        <span>~Pages: <strong style={{ color: T.inkMid }}>{estPages}</strong></span>
        <span style={{ color: T.inkFaint }}>A5 (14.8×21 cm)</span>

/* ─── Main App ─────────────────────────────────────────────────────── */
function NovelForgeV3() {
  const [sideOpen, setSideOpen] = useState(true);
  const [rightOpen, setRightOpen] = useState(true);
  const [mode, setMode] = useState("writing");
  const [view, setView] = useState("dashboard");

  // ── Load from storage or defaults ──
  const [chapters, setChapters] = useState(() => {
    const saved = loadFromStorage();
    return saved ? saved.chapters : DEFAULT_CHAPTERS;
  });
  const [activeChapter, setActiveChapter] = useState(() => {
    const saved = loadFromStorage();
    return saved ? saved.chapters[0].id : DEFAULT_CHAPTERS[0].id;
  });
  const [borderStyle, setBorderStyle] = useState("none");
  const [borderColor, setBorderColor] = useState("#8b4513");

  // ── Autosave when chapters change ──
  useEffect(() => {
    saveToStorage(chapters);
    window.__nfState = { chapters, activeChapter };
  }, [chapters]);

  // ── Chapter operations ──
  const handleUpdateContent = (id, content) => {
    setChapters(prev => prev.map(c => c.id === id ? { ...c, content } : c));
  };

  const handleUpdateNote = (id, note) => {
    setChapters(prev => prev.map(c => c.id === id ? { ...c, note } : c));
  };

  const handleAddChapter = () => {
    const newId = Date.now();
    setChapters(prev => [...prev, { id: newId, title: "บทใหม่", content: "", note: "", status: "outline" }]);
    setActiveChapter(newId);
    setView("editor");
  };

  const handleDeleteChapter = (id) => {
    if (chapters.length <= 1) return;
    setChapters(prev => {
      const filtered = prev.filter(c => c.id !== id);
      if (activeChapter === id) setActiveChapter(filtered[0].id);
      return filtered;
    });
  };

  const CanvasProps = { activeChapter, chapters, borderStyle, borderColor };

  const CanvasMap = {
    writing: <WritingCanvas {...CanvasProps} onUpdateContent={handleUpdateContent} />,
    book: <BookPreviewCanvas {...CanvasProps} />,
    kindle: <KindleCanvas {...CanvasProps} />,
    print: <PrintCanvas {...CanvasProps} />,
  };

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: T.bg0, overflow: "hidden", fontFamily: "'Sarabun', 'Noto Sans Thai', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 5px; height: 5px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2724; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3632; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        input, textarea, select, button { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; }
      `}</style>

      {/* Top bar */}
      <TopBar sideOpen={sideOpen} rightOpen={rightOpen} setSideOpen={setSideOpen} setRightOpen={setRightOpen} />

      {/* Toolbar (only in writing editor) */}
      {view === "editor" && <Toolbar activeMode={mode} borderStyle={borderStyle} setBorderStyle={setBorderStyle} borderColor={borderColor} setBorderColor={setBorderColor} />}

      {/* Main workspace */}
      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>

        {/* Left story panel */}
        {sideOpen && view === "editor" && (
          <StoryPanel
            activeChapter={activeChapter}
            setActiveChapter={setActiveChapter}
            chapters={chapters}
            onAddChapter={handleAddChapter}
            onDeleteChapter={handleDeleteChapter}
          />
        )}

        {/* Center content */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>
          {view === "dashboard" ? (
            <DashboardView setView={setView} chapters={chapters} setActiveChapter={setActiveChapter} />
          ) : (
            CanvasMap[mode]
          )}
        </div>

        {/* Right context panel */}
        {rightOpen && view === "editor" && (
          <ContextPanel
            activeChapter={activeChapter}
            chapters={chapters}
            onUpdateNote={handleUpdateNote}
          />
        )}
      </div>

      {/* Status bar */}
      {view === "editor" && <StatusBar mode={mode} setMode={setMode} chapters={chapters} activeChapter={activeChapter} />}

      {/* Mode thumbs + slash commands + mobile preview */}
      <ModeThumbs mode={mode} setMode={setMode} setView={setView} />
    </div>
  );
}


/* ─── openEditor: transfer data then open editor.html ─── */
function openEditor() {
  // Save chapters to shared localStorage key that editor.html reads
  try {
    const state = window.__nfState;
    if (state && state.chapters && state.chapters.length > 0) {
      const payload = {
        chapters: state.chapters,
        bookInfo: {},
        settings: {},
        savedAt: new Date().toISOString()
      };
      localStorage.setItem('ebook_editor_autosave', JSON.stringify(payload));
    }
  } catch(e) {}
  window.location.href = 'editor.html';
}

/* ─── Patch NovelForgeV3 to expose state ─── */
const _OrigNovelForgeV3 = NovelForgeV3;
function NovelForgeV3Wrapped() {
  const result = _OrigNovelForgeV3();
  // Not needed since we patch at hook level
  return result;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<NovelForgeV3 />);

</script>
